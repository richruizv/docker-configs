x-env: &linkwarden-env
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET}
  NEXTAUTH_URL: ${NEXTAUTH_URL}
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
  MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  linkwarden:
    image: ghcr.io/linkwarden/linkwarden:v2.14.0
    environment:
      <<: *linkwarden-env
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres:5432/postgres
      MEILI_HOST: http://meilisearch:7700
      NEXT_PUBLIC_DISABLE_REGISTRATION: "false"
      NEXT_PUBLIC_CREDENTIALS_ENABLED: "true"
    ports:
      - "3003:3000"
    volumes:
      - /mnt/nas/docker/linkwarden/data:/data/data
    depends_on:
      postgres:
        condition: service_healthy
      meilisearch:
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

  postgres:
    image: postgres:16-alpine
    environment:
      <<: *linkwarden-env
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - /mnt/nas/docker/linkwarden/pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 30s
      timeout: 10s
      retries: 3
    restart: unless-stopped
    logging: *default-logging

  meilisearch:
    image: getmeili/meilisearch:v1.12.8
    environment:
      <<: *linkwarden-env
      MEILI_MASTER_KEY: ${MEILI_MASTER_KEY}
    volumes:
      - /mnt/nas/docker/linkwarden/meili_data:/meili_data
    restart: unless-stopped
    logging: *default-logging

networks:
  default:
    name: proxy-network
    external: true
